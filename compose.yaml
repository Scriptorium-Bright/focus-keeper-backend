services:
  postgres:
    image: postgres:16-alpine
    container_name: rebootfocus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rebootfocus}
      POSTGRES_USER: ${POSTGRES_USER:-rebootfocus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebootfocus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

services:
  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rebootfocus-airflow
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__RBAC: "true"
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      API_USER_ID: ${API_USER_ID:-demo-analytics-user}
      API_START_DATE: ${API_START_DATE:-2026-03-17}
      API_END_DATE: ${API_END_DATE:-2026-03-21}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: >
      bash -lc "
        airflow db migrate &&
        airflow users create
          --role Admin
          --username \"$${AIRFLOW_ADMIN_USERNAME}\"
          --password \"$${AIRFLOW_ADMIN_PASSWORD}\"
          --firstname Reboot
          --lastname Focus
          --email admin@rebootfocus.local || true &&
        airflow scheduler &
        exec airflow webserver
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

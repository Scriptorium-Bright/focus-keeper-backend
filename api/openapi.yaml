openapi: 3.0.3
info:
  title: RebootFocus API
  version: 0.1.0
  description: Recovery coach API baseline for office workers
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Application health check
      operationId: getAppHealth
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppHealthResponse"
  /actuator/health:
    get:
      tags: [Actuator]
      summary: Actuator health endpoint
      operationId: getActuatorHealth
      responses:
        "200":
          description: Actuator health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuatorHealthResponse"
  /api/v1/ops/overview/recovery-loop:
    get:
      tags: [Ops]
      summary: Get recovery loop overview
      operationId: getRecoveryLoopOverview
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Recovery loop overview fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRecoveryLoopOverview"
  /api/v1/ops/overview/batch:
    get:
      tags: [Ops]
      summary: Get batch overview
      operationId: getBatchOverview
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Batch overview fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBatchOverview"
  /api/v1/ops/alerts:
    get:
      tags: [Ops]
      summary: Get operations alerts
      description: Returns alert lifecycle metadata and can be paired with webhook-delivered lifecycle events for external incident notification.
      operationId: getOperationsAlerts
      parameters:
        - in: query
          name: userId
          required: false
          schema:
            type: string
        - in: query
          name: activeOnly
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Operations alerts fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseOperationsAlerts"
  /api/v1/ops/runbooks:
    get:
      tags: [Ops]
      summary: Get operations runbooks
      operationId: getOperationsRunbooks
      responses:
        "200":
          description: Operations runbooks fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRunbooks"
  /api/v1/recovery/inbox-items:
    post:
      tags: [Recovery]
      summary: Save Brain Dump inbox items
      operationId: saveInboxItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInboxItemsRequest"
      responses:
        "200":
          description: Inbox items saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSaveInboxItems"
  /api/v1/recovery/big3:
    post:
      tags: [Recovery]
      summary: Select today's Big3
      operationId: selectBig3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectBig3Request"
      responses:
        "200":
          description: Big3 selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSelectBig3"
  /api/v1/recovery/timeboxes:
    post:
      tags: [Recovery]
      summary: Allocate recovery timeboxes
      operationId: allocateTimeboxes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocateTimeboxesRequest"
      responses:
        "200":
          description: Recovery timeboxes allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseAllocateTimeboxes"
        "409":
          description: Conflicting timebox detected
  /api/v1/recovery/sessions/start:
    post:
      tags: [Recovery]
      summary: Start a recovery session
      operationId: startRecoverySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRecoverySessionRequest"
      responses:
        "200":
          description: Recovery session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRecoverySession"
  /api/v1/recovery/sessions/complete:
    post:
      tags: [Recovery]
      summary: Complete a recovery session
      operationId: completeRecoverySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecoverySessionRequest"
      responses:
        "200":
          description: Recovery session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRecoverySession"
  /api/v1/recovery/sessions/interrupt:
    post:
      tags: [Recovery]
      summary: Interrupt a recovery session
      operationId: interruptRecoverySession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecoverySessionRequest"
      responses:
        "200":
          description: Recovery session interrupted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRecoverySession"
  /api/v1/recovery/failures/check-in:
    post:
      tags: [Recovery]
      summary: Check in a recovery failure
      operationId: checkInFailure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailureCheckInRequest"
      responses:
        "200":
          description: Failure check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFailureCheckIn"
  /api/v1/recovery/restarts:
    post:
      tags: [Recovery]
      summary: Execute a 10-minute restart
      operationId: restartRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestartRecoveryRequest"
      responses:
        "200":
          description: Recovery restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseRestartRecovery"
  /api/v1/recovery/retrospectives/weekly:
    post:
      tags: [Retrospective]
      summary: Generate weekly retrospective
      operationId: generateWeeklyRetrospective
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateWeeklyRetrospectiveRequest"
      responses:
        "200":
          description: Weekly retrospective generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWeeklyRetrospective"
    get:
      tags: [Retrospective]
      summary: Get weekly retrospective
      operationId: getWeeklyRetrospective
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: weekStart
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly retrospective fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWeeklyRetrospective"
  /api/v1/recovery/analytics/kpis/daily:
    post:
      tags: [Analytics]
      summary: Generate daily KPI mart
      operationId: generateDailyKpi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDailyKpiRequest"
      responses:
        "200":
          description: Daily KPI generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDailyKpi"
    get:
      tags: [Analytics]
      summary: Get daily KPI mart
      operationId: getDailyKpi
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily KPI fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDailyKpi"
  /api/v1/recovery/analytics/kpis/daily/quality:
    get:
      tags: [Analytics]
      summary: Get daily KPI quality report
      operationId: getDailyKpiQuality
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily KPI quality report fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDailyKpiQuality"
  /api/v1/recovery/analytics/kpis/daily/backfill:
    post:
      tags: [Analytics]
      summary: Backfill daily KPI mart
      operationId: backfillDailyKpi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackfillDailyKpiRequest"
      responses:
        "200":
          description: Daily KPI backfill completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseBackfillDailyKpi"
  /api/v1/recovery/analytics/kpis/daily/last-processed-date:
    get:
      tags: [Analytics]
      summary: Get daily KPI last processed date
      operationId: getDailyKpiLastProcessedDate
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily KPI last processed date fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseDailyKpiLastProcessedDate"
  /api/v1/recovery/analytics/failure-hours:
    post:
      tags: [Analytics]
      summary: Generate failure hour distribution
      operationId: generateFailureHourDistribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFailureHourDistributionRequest"
      responses:
        "200":
          description: Failure hour distribution generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFailureHourDistribution"
    get:
      tags: [Analytics]
      summary: Get failure hour distribution
      operationId: getFailureHourDistribution
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Failure hour distribution fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFailureHourDistribution"
  /api/v1/recovery/analytics/friction-signals:
    post:
      tags: [Analytics]
      summary: Generate friction signals
      operationId: generateFrictionSignals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFrictionSignalsRequest"
      responses:
        "200":
          description: Friction signals generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFrictionSignals"
    get:
      tags: [Analytics]
      summary: Get friction signals
      operationId: getFrictionSignals
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Friction signals fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFrictionSignals"
  /api/v1/recovery/analytics/friction-segments:
    get:
      tags: [Analytics]
      summary: Get friction segments
      operationId: getFrictionSegments
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
        - in: query
          name: metricDate
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Friction segments fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFrictionSegments"
components:
  schemas:
    ApiResponseSaveInboxItems:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/SaveInboxItemsResponse"
        message:
          type: string
          example: INBOX_ITEMS_SAVED
        traceId:
          type: string
    ApiResponseSelectBig3:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/SelectBig3Response"
        message:
          type: string
          example: BIG3_SELECTED
        traceId:
          type: string
    ApiResponseAllocateTimeboxes:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AllocateTimeboxesResponse"
        message:
          type: string
          example: TIMEBOXES_ALLOCATED
        traceId:
          type: string
    ApiResponseRecoverySession:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/RecoverySessionResponse"
        message:
          type: string
          example: RECOVERY_SESSION_STARTED
        traceId:
          type: string
    ApiResponseFailureCheckIn:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/FailureCheckInResponse"
        message:
          type: string
          example: FAILURE_CHECKED_IN
        traceId:
          type: string
    ApiResponseRestartRecovery:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/RestartRecoveryResponse"
        message:
          type: string
          example: RECOVERY_RESTARTED
        traceId:
          type: string
    ApiResponseWeeklyRetrospective:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/WeeklyRetrospectiveResponse"
        message:
          type: string
          example: WEEKLY_RETROSPECTIVE_FETCHED
        traceId:
          type: string
    ApiResponseDailyKpi:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/DailyKpiResponse"
        message:
          type: string
          example: DAILY_KPI_FETCHED
        traceId:
          type: string
    ApiResponseDailyKpiQuality:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/DailyKpiQualityResponse"
        message:
          type: string
          example: DAILY_KPI_QUALITY_FETCHED
        traceId:
          type: string
    ApiResponseBackfillDailyKpi:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/BackfillDailyKpiResponse"
        message:
          type: string
          example: DAILY_KPI_BACKFILL_COMPLETED
        traceId:
          type: string
    ApiResponseDailyKpiLastProcessedDate:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/DailyKpiLastProcessedDateResponse"
        message:
          type: string
          example: DAILY_KPI_LAST_PROCESSED_DATE_FETCHED
        traceId:
          type: string
    ApiResponseRecoveryLoopOverview:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/RecoveryLoopOverviewResponse"
        message:
          type: string
          example: OPS_RECOVERY_LOOP_OVERVIEW_FETCHED
        traceId:
          type: string
    ApiResponseBatchOverview:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/BatchOverviewResponse"
        message:
          type: string
          example: OPS_BATCH_OVERVIEW_FETCHED
        traceId:
          type: string
    ApiResponseOperationsAlerts:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperationsAlertResponse"
        message:
          type: string
          example: OPS_ALERTS_FETCHED
        traceId:
          type: string
    ApiResponseRunbooks:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunbookScenarioResponse"
        message:
          type: string
          example: OPS_RUNBOOKS_FETCHED
        traceId:
          type: string
    ApiResponseFailureHourDistribution:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/FailureHourDistributionResponse"
        message:
          type: string
          example: FAILURE_HOUR_DISTRIBUTION_FETCHED
        traceId:
          type: string
    ApiResponseFrictionSignals:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/FrictionSignalReportResponse"
        message:
          type: string
          example: FRICTION_SIGNALS_FETCHED
        traceId:
          type: string
    ApiResponseFrictionSegments:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/FrictionSegmentReportResponse"
        message:
          type: string
          example: FRICTION_SEGMENTS_FETCHED
        traceId:
          type: string
    SaveInboxItemsRequest:
      type: object
      required: [userId, items]
      properties:
        userId:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/InboxItemPayload"
    InboxItemPayload:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 200
    SaveInboxItemsResponse:
      type: object
      properties:
        savedCount:
          type: integer
        savedItems:
          type: array
          items:
            $ref: "#/components/schemas/SavedInboxItem"
    SavedInboxItem:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    SelectBig3Request:
      type: object
      required: [userId, itemIds]
      properties:
        userId:
          type: string
        itemIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
    SelectBig3Response:
      type: object
      properties:
        selectedDate:
          type: string
          format: date
        selectedAt:
          type: string
          format: date-time
        selectedCount:
          type: integer
        selectedItems:
          type: array
          items:
            $ref: "#/components/schemas/Big3Item"
    Big3Item:
      type: object
      properties:
        itemId:
          type: string
        content:
          type: string
    AllocateTimeboxesRequest:
      type: object
      required: [userId, timeboxes]
      properties:
        userId:
          type: string
        timeboxes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/TimeboxPayload"
    TimeboxPayload:
      type: object
      required: [itemId, startAt, endAt, type]
      properties:
        itemId:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        firstRecoveryBlock:
          type: boolean
        type:
          type: string
          enum: [WORK, BREAK]
    AllocateTimeboxesResponse:
      type: object
      properties:
        plannedDate:
          type: string
          format: date
        allocatedCount:
          type: integer
        timeboxes:
          type: array
          items:
            $ref: "#/components/schemas/AllocatedTimebox"
    AllocatedTimebox:
      type: object
      properties:
        timeboxId:
          type: string
        itemId:
          type: string
        content:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        firstRecoveryBlock:
          type: boolean
        type:
          type: string
          enum: [WORK, BREAK]
        createdAt:
          type: string
          format: date-time
    StartRecoverySessionRequest:
      type: object
      required: [userId, timeboxId]
      properties:
        userId:
          type: string
        timeboxId:
          type: string
    UpdateRecoverySessionRequest:
      type: object
      required: [userId, sessionId]
      properties:
        userId:
          type: string
        sessionId:
          type: string
    RecoverySessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        timeboxId:
          type: string
        status:
          type: string
          enum: [STARTED, COMPLETED, INTERRUPTED]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    FailureCheckInRequest:
      type: object
      required: [userId, sessionId, reason]
      properties:
        userId:
          type: string
        sessionId:
          type: string
        reason:
          type: string
          enum: [TOO_BIG, INTERRUPTION, LOW_ENERGY, UNCLEAR_NEXT_ACTION, CONTEXT_SWITCHED]
        note:
          type: string
          maxLength: 200
    FailureCheckInResponse:
      type: object
      properties:
        failureEventId:
          type: string
        sessionId:
          type: string
        timeboxId:
          type: string
        reason:
          type: string
        note:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        sessionStatus:
          type: string
          enum: [INTERRUPTED]
        restartSuggestion:
          $ref: "#/components/schemas/RestartSuggestionResponse"
    RestartRecoveryRequest:
      type: object
      required: [userId, failureEventId]
      properties:
        userId:
          type: string
        failureEventId:
          type: string
    RestartRecoveryResponse:
      type: object
      properties:
        restartEvent:
          $ref: "#/components/schemas/RestartEventResponse"
        recoverySession:
          $ref: "#/components/schemas/RecoverySessionResponse"
        restartSuggestion:
          $ref: "#/components/schemas/RestartSuggestionResponse"
    RestartEventResponse:
      type: object
      properties:
        id:
          type: string
        failureEventId:
          type: string
        restartType:
          type: string
          enum: [QUICK_RESTART]
        suggestedMinutes:
          type: integer
        occurredAt:
          type: string
          format: date-time
    RestartSuggestionResponse:
      type: object
      properties:
        restartType:
          type: string
        suggestedMinutes:
          type: integer
        message:
          type: string
    GenerateWeeklyRetrospectiveRequest:
      type: object
      required: [userId, weekStart]
      properties:
        userId:
          type: string
        weekStart:
          type: string
          format: date
    WeeklyRetrospectiveResponse:
      type: object
      properties:
        retrospectiveId:
          type: string
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        sessionStartedCount:
          type: integer
          format: int64
        sessionCompletedCount:
          type: integer
          format: int64
        sessionInterruptedCount:
          type: integer
          format: int64
        failureCount:
          type: integer
          format: int64
        restartCount:
          type: integer
          format: int64
        dominantFailureReason:
          type: string
        summary:
          type: string
        antiSlipAction:
          $ref: "#/components/schemas/AntiSlipActionResponse"
        generatedAt:
          type: string
          format: date-time
    AntiSlipActionResponse:
      type: object
      properties:
        actionCode:
          type: string
        title:
          type: string
        description:
          type: string
    GenerateDailyKpiRequest:
      type: object
      required: [userId, metricDate]
      properties:
        userId:
          type: string
        metricDate:
          type: string
          format: date
    DailyKpiResponse:

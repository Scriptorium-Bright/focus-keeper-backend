name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew clean bootJar --no-daemon

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: focuskeeper-reboot-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Build Docker image
        run: docker build --build-arg JAR_FILE=build/libs/*.jar -t focuskeeper-reboot:${{ github.sha }} .

      - name: Export Docker image artifact
        run: |
          mkdir -p dist/docker
          docker save focuskeeper-reboot:${{ github.sha }} -o dist/docker/focuskeeper-reboot-${{ github.sha }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: focuskeeper-reboot-image
          path: dist/docker/*.tar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: focuskeeper-reboot-jar
          path: dist/jar

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: focuskeeper-reboot-image
          path: dist/image

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jar/*.jar
            dist/image/*.tar

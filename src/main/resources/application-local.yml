spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rebootfocus}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:rebootfocus}
    password: ${DB_PASSWORD:rebootfocus}
    hikari:
      maximum-pool-size: 15

  batch:
    job:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          batch_size: 15
        order_inserts: true
        order_updates: true


logging:
  level:
    root: INFO
    com.focuskeeper.reboot: DEBUG

management:
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: rebootfocus-api
  profiles:
    default: local
  jpa:
    open-in-view: false
  batch:
    job:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: RebootFocus API
    description: Recovery coach API baseline for office workers

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

ops:
  notifications:
    webhook:
      enabled: false
      url:
      connect-timeout-ms: 1000
      read-timeout-ms: 1000
      headers: {}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

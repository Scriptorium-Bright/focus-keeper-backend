spring:
  application:
    name: focuskeeper-reboot
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: FocusKeeper Reboot
    description: Phase 1 bootstrap baseline

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

spring:
  application:
    name: rebootfocus-api
  profiles:
    default: local
  jpa:
    open-in-view: false

server:
  port: 10080

management:
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: RebootFocus API
    description: Recovery coach API baseline for office workers

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

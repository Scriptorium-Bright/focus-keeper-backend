spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rebootfocus_oom}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:rebootfocus}
    password: ${DB_PASSWORD:rebootfocus}
    hikari:
      maximum-pool-size: 17

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true  # 2. 쿼리를 한 줄이 아닌, 예쁘게 들여쓰기해서 보여줌
        highlight_sql: true # 3. (선택) 쿼리에 SQL 문법 색상(Color)을 입혀서 가독성을 높임
        jdbc:
          batch_size: 90
        order_inserts: true
        order_updates: true


logging:
  level:
    root: INFO
    com.focuskeeper.reboot: TRACE
#    org.hibernate.orm.jdbc.bind: trace
#    org.hibernate.orm.jdbc.extract: trace

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

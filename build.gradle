plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.focuskeeper'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'test')
}

tasks.register('expirationMemoryHarness', Test) {
    description = 'Runs the isolated Big3 expiration memory pressure harness.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching(
                'com.focuskeeper.reboot.recovery.planning.service.Big3ServiceExpirationMemoryPressureHarnessTest'
        )
    }

    environment 'PERF_EXPIRATION_MEMORY_ENABLED', 'true'
    maxHeapSize = System.getenv().getOrDefault('PERF_EXPIRATION_MAX_HEAP', '512m')
    forkEvery = 1
    testLogging {
        showStandardStreams = true
    }

    doFirst {
        if (System.getenv('PERF_EXPIRATION_CONFIRM_DEDICATED_DB') != 'true') {
            throw new GradleException(
                    'Set PERF_EXPIRATION_CONFIRM_DEDICATED_DB=true after selecting a disposable DB_NAME. '
                            + 'The local profile uses ddl-auto=create and the expiration job updates all matching rows.'
            )
        }
    }
}

groups:
  - name: rebootfocus-recording
    interval: 15s
    rules:
      - record: reboot:jvm_heap_used_ratio
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          /
          sum(jvm_memory_max_bytes{area="heap"})

      - record: reboot:http_5xx_ratio:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)

      - record: reboot:http_duration_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          )

      - record: reboot:expiration_duration_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(reboot_expiration_duration_seconds_bucket[30m])
            )
          )

groups:
  - name: rebootfocus-alerts
    rules:
      - alert: RebootFocusApiDown
        expr: up{job="rebootfocus-api"} == 0
        for: 30s
        labels:
          severity: critical
          owner: backend
        annotations:
          summary: RebootFocus API metrics target is down
          runbook: docs/study/PROMETHEUS_GRAFANA_IMPLEMENTATION_PLAN.md

      - alert: RebootFocusJvmHeapHigh
        expr: reboot:jvm_heap_used_ratio > 0.85
        for: 5m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: JVM heap usage has remained above 85 percent
          runbook: docs/study/BIG3_EXPIRATION_OOM_TEST_GUIDE.md

      - alert: RebootFocusHikariPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: Threads are waiting for a database connection
          runbook: docs/study/PROMETHEUS_GRAFANA_IMPLEMENTATION_PLAN.md

      - alert: RebootFocusExpirationFailure
        expr: increase(reboot_expiration_runs_total{status="failure"}[15m]) > 0
        labels:
          severity: critical
          owner: backend
        annotations:
          summary: The Big3 expiration job failed
          runbook: docs/study/BIG3_EXPIRATION_OOM_TEST_GUIDE.md

      - alert: RebootFocusExpirationRunningTooLong
        expr: reboot_expiration_running == 1
        for: 15m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: The Big3 expiration job has been running for more than 15 minutes
          runbook: docs/study/BIG3_EXPIRATION_OOM_TEST_GUIDE.md

      - alert: RebootFocusExpirationStale
        expr: |
          (
            time() - reboot_expiration_last_success_timestamp_seconds > 90000
          )
          and
          (
            reboot_expiration_last_success_timestamp_seconds > 0
          )
        for: 10m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: No successful Big3 expiration run has been observed for 25 hours
          runbook: docs/study/BIG3_EXPIRATION_OOM_TEST_GUIDE.md

      - alert: RebootFocusHttp5xxHigh
        expr: reboot:http_5xx_ratio:rate5m > 0.05
        for: 5m
        labels:
          severity: warning
          owner: backend
        annotations:
          summary: HTTP 5xx ratio has remained above 5 percent
          runbook: docs/study/PROMETHEUS_GRAFANA_IMPLEMENTATION_PLAN.md

pg_lock_observation:
  query: "SELECT current_database() AS datname, count(*) FILTER (WHERE activity.state = 'active')::bigint AS active_sessions, count(*) FILTER (WHERE activity.wait_event_type = 'Lock')::bigint AS waiting_sessions, (SELECT wal_bytes::double precision FROM pg_stat_wal) AS wal_bytes FROM pg_stat_activity activity WHERE activity.datname = current_database() AND activity.pid <> pg_backend_pid();"
  metrics:
    - datname:
        usage: "LABEL"
        description: "Name of the database"
    - active_sessions:
        usage: "GAUGE"
        description: "Number of active sessions in the database"
    - waiting_sessions:
        usage: "GAUGE"
        description: "Number of sessions currently waiting on a PostgreSQL lock"
    - wal_bytes:
        usage: "COUNTER"
        description: "Total number of WAL bytes generated by the PostgreSQL cluster"
